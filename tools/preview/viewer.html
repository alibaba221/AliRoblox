<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Castelmare preview</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const W = window.PREVIEW_WIDTH || 1280, H = window.PREVIEW_HEIGHT || 720;
const data = await (await fetch('./out/' + (new URLSearchParams(location.search).get('data') || 'town.json'))).json();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Sky gradient
const sky = document.createElement('canvas'); sky.width = 4; sky.height = 256;
const g = sky.getContext('2d'); const grad = g.createLinearGradient(0, 0, 0, 256);
grad.addColorStop(0, '#6f95c4'); grad.addColorStop(0.45, '#b9c7d6'); grad.addColorStop(0.62, '#f0d2a8'); grad.addColorStop(1, '#e8b68a');
g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
const skyTex = new THREE.CanvasTexture(sky); skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;
scene.fog = new THREE.Fog(0xe2c7a4, 350, 1500);

const hemi = new THREE.HemisphereLight(0xc4d4ee, 0x8a6a4c, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffcf9a, 3.1);
const sunDir = new THREE.Vector3(-0.78, 0.36, 0.5).normalize();
sun.position.copy(sunDir.clone().multiplyScalar(600));
sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -330; sc.right = 330; sc.top = 330; sc.bottom = -330; sc.near = 10; sc.far = 1400;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun); scene.add(sun.target);

// ---------- geometries ----------
function wedgeGeometry() {
  const A = [-0.5, -0.5, -0.5], B = [0.5, -0.5, -0.5], C = [-0.5, -0.5, 0.5], D = [0.5, -0.5, 0.5];
  const E = [-0.5, 0.5, 0.5], F = [0.5, 0.5, 0.5];
  const tris = [
    A, B, D, A, D, C,   // bottom
    C, D, F, C, F, E,   // back (+z)
    A, E, F, A, F, B,   // slope
    A, C, E,            // left
    B, F, D,            // right
  ];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3));
  geo.computeVertexNormals();
  return geo;
}
const cyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 20); cyl.rotateZ(Math.PI / 2);
const GEOS = {
  Block: new THREE.BoxGeometry(1, 1, 1),
  WedgePart: wedgeGeometry(),
  CornerWedgePart: new THREE.BoxGeometry(1, 1, 1),
  Cylinder: cyl,
  Ball: new THREE.SphereGeometry(0.5, 18, 12),
  MeshSphere: new THREE.SphereGeometry(0.5, 18, 12),
  MeshHead: new THREE.SphereGeometry(0.5, 16, 12),
};

const ROUGH = { SmoothPlastic: 0.45, Plastic: 0.6, Metal: 0.45, Glass: 0.08, Neon: 1, Fabric: 0.95, Marble: 0.3, CeramicTiles: 0.3 };
function materialFor(mat, transparent) {
  if (mat === 'Neon') return new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
  const m = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: ROUGH[mat] ?? 0.88,
    metalness: mat === 'Metal' ? 0.55 : mat === 'Glass' ? 0.3 : 0.0,
    transparent, opacity: transparent ? 0.55 : 1,
  });
  return m;
}

const groups = new Map();
for (const p of data.parts) {
  if (p.t >= 0.99) continue;
  const transparent = p.t > 0.05;
  const cls = p.m === 'Neon' ? 'Neon' : p.m === 'Metal' ? 'Metal' : p.m === 'Glass' ? 'Glass' : ROUGH[p.m] !== undefined ? p.m : 'Rough';
  const key = p.k + '|' + cls + '|' + transparent;
  if (!groups.has(key)) groups.set(key, { k: p.k, mat: cls, transparent, list: [] });
  groups.get(key).list.push(p);
}
const m4 = new THREE.Matrix4(), s4 = new THREE.Matrix4(), col = new THREE.Color();
let meshCount = 0;
for (const grp of groups.values()) {
  const geo = GEOS[grp.k] || GEOS.Block;
  const mesh = new THREE.InstancedMesh(geo, materialFor(grp.mat, grp.transparent), grp.list.length);
  grp.list.forEach((p, i) => {
    const c = p.cf;
    m4.set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
    let sx = p.s[0], sy = p.s[1], sz = p.s[2];
    if (grp.k === 'Ball') { const d = Math.min(sx, sy, sz); sx = sy = sz = d; }
    if (grp.k === 'Cylinder') { const d = Math.min(sy, sz); sy = sz = d; }
    if (grp.k === 'MeshHead') { sx *= 0.6; }
    s4.makeScale(sx, sy, sz);
    m4.multiply(s4);
    mesh.setMatrixAt(i, m4);
    col.setRGB(p.c[0] / 255, p.c[1] / 255, p.c[2] / 255, THREE.SRGBColorSpace);
    if (grp.mat === 'Neon') col.multiplyScalar(1.6);
    mesh.setColorAt(i, col);
  });
  mesh.castShadow = grp.mat !== 'Neon' && !grp.transparent;
  mesh.receiveShadow = true;
  scene.add(mesh);
  meshCount++;
}

// ---------- terrain ----------
const T = data.terrain || null;
if (!T) {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0xcfc3a8, roughness: 0.95 }));
  floor.rotateX(-Math.PI / 2); floor.receiveShadow = true; scene.add(floor);
  scene.fog = null;
} else {
const tgeo = new THREE.PlaneGeometry((T.nx - 1) * T.step, (T.nz - 1) * T.step, T.nx - 1, T.nz - 1);
tgeo.rotateX(-Math.PI / 2);
const pos = tgeo.attributes.position;
const colors = new Float32Array(pos.count * 3);
const grass = new THREE.Color().setRGB(150/255, 150/255, 88/255, THREE.SRGBColorSpace);
const rock = new THREE.Color().setRGB(164/255, 150/255, 128/255, THREE.SRGBColorSpace);
const sand = new THREE.Color().setRGB(222/255, 202/255, 160/255, THREE.SRGBColorSpace);
const ground = new THREE.Color().setRGB(150/255, 118/255, 86/255, THREE.SRGBColorSpace);
const hAt = (ix, iz) => T.h[Math.min(T.nz - 1, Math.max(0, iz)) * T.nx + Math.min(T.nx - 1, Math.max(0, ix))];
for (let iz = 0; iz < T.nz; iz++) for (let ix = 0; ix < T.nx; ix++) {
  const i = iz * T.nx + ix;
  const x = T.x0 + ix * T.step, z = T.z0 + iz * T.step, h = T.h[i];
  pos.setXYZ(i, x, h, z);
  const slope = Math.max(Math.abs(hAt(ix + 1, iz) - hAt(ix - 1, iz)), Math.abs(hAt(ix, iz + 1) - hAt(ix, iz - 1))) / (2 * T.step);
  let c = grass;
  if (h < 5 && z > 150) c = sand; else if (slope > 0.75) c = rock; else if (slope > 0.45) c = ground;
  colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
}
tgeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
tgeo.computeVertexNormals();
const terrain = new THREE.Mesh(tgeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
terrain.receiveShadow = true; terrain.castShadow = true;
scene.add(terrain);
for (const b of T.balls) {
  const c = b[4] === 'Rock' ? rock : b[4] === 'Ground' ? ground : grass;
  const m = new THREE.Mesh(GEOS.Ball, new THREE.MeshStandardMaterial({ color: c, roughness: 0.95 }));
  m.position.set(b[0], b[1], b[2]); m.scale.setScalar(b[3] * 2); m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
}
const water = new THREE.Mesh(new THREE.PlaneGeometry(1800, 900), new THREE.MeshStandardMaterial({
  color: new THREE.Color().setRGB(34/255, 110/255, 124/255, THREE.SRGBColorSpace), roughness: 0.12, metalness: 0.25, transparent: true, opacity: 0.86 }));
water.rotateX(-Math.PI / 2); water.position.set(0, 0, 196 + 450); water.receiveShadow = true;
scene.add(water);
const river = new THREE.Mesh(new THREE.PlaneGeometry(24, 360), water.material);
river.rotateX(-Math.PI / 2); river.position.set(-185, -12, 30); scene.add(river);
}

// ---------- views ----------
const camera = new THREE.PerspectiveCamera(70, W / H, 0.5, 4000);
window.renderView = (view) => {
  if (view.ortho) {
    const s = view.ortho;
    const cam = new THREE.OrthographicCamera(-s * W / H, s * W / H, s, -s, 1, 3000);
    cam.position.set(view.target[0], 1000, view.target[2]); cam.up.set(0, 0, -1); cam.lookAt(view.target[0], 0, view.target[2]);
    renderer.render(scene, cam);
    return;
  }
  camera.fov = view.fov || 70;
  camera.position.set(...view.pos);
  camera.lookAt(...view.target);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};
window.PREVIEW_READY = { meshes: meshCount, parts: data.parts.length };
</script>
</body>
</html>
